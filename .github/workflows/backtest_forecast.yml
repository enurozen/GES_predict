name: Backtest Day-Ahead Forecast Accuracy

# Manual only: scores the hybrid model against REAL archived forecast
# weather (not after-the-fact reanalysis) for the most recent N days, to
# answer "how accurate is predict.py actually, once weather forecast error
# is included?" No EPİAŞ credentials needed - only reads existing data/
# CSVs and calls Open-Meteo.
on:
  workflow_dispatch:
    inputs:
      plant_id:
        description: "Plant ID (must exist in plants.yaml)"
        required: false
        default: "2579"
      test_days:
        description: "Most recent N days to hold out and score"
        required: false
        default: "14"
  # TEMP: workflow_dispatch only fires from the default branch until this
  # workflow file is merged there, so a push trigger is added here to get
  # one real run on this feature branch. Remove this push block on merge.
  push:
    branches:
      - claude/branch-analysis-9kdbvo

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run forecast-based backtest
        run: |
          python backtest_forecast.py \
            --plant-id "${{ inputs.plant_id }}" \
            --test-days "${{ inputs.test_days }}" \
            2>&1 | tee backtest_output.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Backtest sonuçları (plant ${{ inputs.plant_id }}, son ${{ inputs.test_days }} gün)"
            echo '```'
            cat backtest_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
