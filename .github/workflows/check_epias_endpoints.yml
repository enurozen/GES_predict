name: Check EPİAŞ SMF Endpoint

# Diagnostic: re-confirms the real field names in EPİAŞ's SMF response if
# needed (already confirmed as of 2026-08-02, see epias.py's
# _PRICE_FIELD_CANDIDATES). See check_epias_endpoints.py.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to check (YYYY-MM-DD), leave empty for yesterday"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run endpoint check
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python check_epias_endpoints.py --date "${{ inputs.date }}" 2>&1 | tee check_output.txt
          else
            python check_epias_endpoints.py 2>&1 | tee check_output.txt
          fi

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## EPİAŞ SMF endpoint kontrolü"
            echo '```'
            cat check_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
