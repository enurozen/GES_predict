name: Daily EPİAŞ Data Pull

# Runs every day at 03:00 UTC (06:00 Türkiye saati), once the previous day's
# generation data has settled on EPİAŞ's side. Also runnable on demand.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write  # needed so the workflow can commit the CSV back to data/

env:
  # plants.yaml'da bir girdisi olan santral ID'si - lat/lon/capacity_mw
  # oradan okunur, burada tekrar girilmez.
  PLANT_ID: "2579"

jobs:
  pull-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute yesterday's date (UTC)
        id: date
        run: echo "yesterday=$(date -u -d 'yesterday' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build training dataset for yesterday
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
        run: |
          python main.py \
            --plant-id "$PLANT_ID" \
            --start "${{ steps.date.outputs.yesterday }}" \
            --end "${{ steps.date.outputs.yesterday }}" \
            --output "data/${PLANT_ID}/${{ steps.date.outputs.yesterday }}.csv"

      - name: Commit CSV to data/
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: santral ${{ env.PLANT_ID }} - ${{ steps.date.outputs.yesterday }}"
          file_pattern: "data/**/*.csv"
